name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check . ../research
      - name: Tests
        run: python -m pytest -q
